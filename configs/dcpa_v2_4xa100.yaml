  preset: moe_2_6b
  vocab_size: 256
  d_s: 384
  d_concept: 2048
  k_slots: 8
  d_r: 64
  d_merge: 512
  d_h: 8192
  s_active: 48
  d_l: 64
  num_lang_domains: 6
  num_style_domains: 5
  num_experts: 64
  top_k_experts: 2
  expert_hidden: 3264
  l_max: 12
  tau_skip: 0.32
  tau_halt: 0.22
  ponder_eta: 0.5
  lambda_moe_bal: 0.01
  max_seg_len: 16
  target_spike_rate: 0.10526315789473684  # 1 / 9.5
  lambda_rate: 2.0
  lambda_var: 1.0
  lambda_act: 0.01
  lambda_halt: 1.0
  gamma_hip: 0.999
  lambda_eta: 0.95
  kappa_quench: 0.95
  householder_max_writes: 32
  householder_write_threshold: 0.05

