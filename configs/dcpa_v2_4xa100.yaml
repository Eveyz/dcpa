hardware:
  target_tokens_bytes_per_step: 524288     # 512 KB/step global = 131,072 B/GPU x 4x A100 (grad_accum=1)
  fixed_global_batch: false                # Auto-expands if launched on 8x A100 without starving GPUs
  auto_lr_scale_multi_gpu: true
  bf16_grad_comm: true
  length_bucketing: true
  allow_tf32: true
  bf16_autocast: true
  use_grad_scaler: false
  compile_mode: auto
  compile_doc_bucket_size: 16
  compile_cache_size_limit: 128
  bcg_checkpoint_vram_watermark_gb: 42.0   # Activates selective BCG checkpointing only when VRAM > 42 GB
  prefetch_depth: 4
  prefetch_workers: 2

optimizer:
  type: AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip_norm: 1.0
  groups:
    group_matrix_decay:
      lr: 3.8e-4                           # Spectral-safe sqrt-batch + width-scaled LR for d_concept=2048 @ 512 KB/step
      weight_decay: 0.05
    group_norm_embed_nodecay:
      lr: 3.8e-4
      weight_decay: 0.0
    group_gates_thresholds:
      lr: 1.0e-3
      weight_decay: 0.0

curriculum:
  total_steps: 200000
  stage_boundaries: [0, 24000, 124000, 188000, 200000]
  stage1:
    name: sensorimotor_spelling_autoencoder
    model_stage: A
    global_warmup_steps: 2500
    max_doc_bytes: 512
    domain_weights: [0.35, 0.35, 0.15, 0.15]   # [en(0), zh(1), python(3), javascript(5)]
    wug_ratio: 0.0
    tau_s_start: 1.0
    tau_s_end: 0.35
    target_rho: 9.5
    lambda_rate: 2.0
    lambda_var: 1.0
    lambda_halt: 1.0
    lambda_pc: 0.0
    lambda_act: 0.0
  stage2:
    name: bottlenecked_concept_merge_and_pondering
    model_stage: B
    bcg_local_warmup_steps: 1500
    local_warmup_start_factor: 0.01
    domain_weights: [0.32, 0.36, 0.16, 0.16]   # [en(0), zh(1), python(3), javascript(5)]
    wug_ratio: 0.0
    tau_m_start: 1.5
    tau_m_end: 0.25
    tau_s: 0.30
    target_rho: 9.5
    lambda_rate: 2.0
    lambda_var: 1.0
    lambda_halt: 1.0
    lambda_pc_ramp_steps: 3000
    lambda_pc_target: 0.5
    lambda_act_delay_steps: 1000
    lambda_act_ramp_steps: 9000
    lambda_act_target: 0.01
  stage3:
    name: bilingual_reasoning_instruct_toolcall_and_code_stack
    model_stage: C
    lr_cosine_end_ratio: 0.20
    max_doc_bytes: 4096
    domain_weights: [0.26, 0.28, 0.23, 0.23]   # [en(0), zh(1), python(3), javascript(5)]
    wug_ratio: 0.0
    tau_m: 0.25
    tau_s: 0.25
    target_rho: 9.5
    lambda_rate: 2.0
    lambda_var: 1.0
    lambda_halt: 1.0
    lambda_pc: 0.5
    lambda_act: 0.01
    code_delimiter_focal_weight: 1.5
    code_delimiter_chars: "{}()[]:;\n"
    broca_cq_prob: 0.20
    cap_mix_ratio: 0.45                        # 45% mix across cap_reasoning + cap_instruct + cap_toolcall + cap_writing
  stage4:
    name: hippocampal_oneshot_meta_plasticity
    model_stage: D
    hip_local_warmup_steps: 600
    local_warmup_start_factor: 0.01
    lr_scale: 0.25
    max_doc_bytes: 1024
    domain_weights: [0.25, 0.25, 0.25, 0.25]   # [en(0), zh(1), python(3), javascript(5)]
    wug_ratio: 0.50
    wug_target_weight: 3.0
    lambda_ach_reg: 0.5
    tau_m: 0.25
    tau_s: 0.25
    lambda_rate: 0.0
    lambda_var: 0.0
    lambda_halt: 0.0
    lambda_pc: 0.0
    lambda_act: 0.0

watchdog:
  window_size: 20
  rule_bcd_warmup_steps: 500
  compression_ratio_min: 2.5
  compression_ratio_max: 25.0
  concept_std_min_floor: 0.35
  merge_entropy_min: 0.08
  skip_batches_on_rollback: 10
  seed_stride_on_rollback: 9973
  rule_a_lr_multiplier: 0.7
  rule_b_lambda_rate_multiplier: 3.0
  rule_b_lambda_rate_cap: 50.0
  rule_b_tau_s_floor: 0.5
  rule_c_lambda_var_multiplier: 2.5
  rule_c_lambda_var_cap: 25.0
  rule_d_tau_m_delta: 0.4
  rule_d_tau_m_cap: 1.2
  rule_d_explore_steps: 1000
  rule_d_uniform_mix: 0.10
  rule_d_merge_kl_weight: 0.10
  max_consecutive_rollbacks: 3
  min_progress_steps_to_reset_breaker: 200
  events_log_path: artifacts/logs/watchdog_events.jsonl

checkpointing:
  ckpt_dir: artifacts/checkpoints
  healthy_save_every_steps: 1000
  milestone_every_steps: 5000
  save_every_minutes: 15.0
  export_dir: artifacts/export
  final_safetensors_name: dcpa_final.safetensors

visual_probe:
