# DCPA v2 Multi-GPU Production Config — Tuned for 4x NVIDIA A100 SXM4 80GB (Vast.ai / NVLink)
#
# Flagship default preset: `moe_2_6b` (~2.68B slow parameters, 64 Experts Top-2 -> ~126M active/concept)
# Switchable via CLI `--preset {moe_1_8b, moe_2_6b, moe_3_5b, moe_650m, moe_210m}`:
#   - `moe_1_8b`: ~1.79B slow | ~93M active  | ~220k-260k steps/week on 4x A100 (~120 GB UTF-8 bytes)
#   - `moe_2_6b`: ~2.68B slow | ~126M active | ~180k-210k steps/week on 4x A100 (~100 GB UTF-8 bytes) [RECOMMENDED]
#   - `moe_3_5b`: ~3.54B slow | ~161M active | ~130k-155k steps/week on 4x A100 (~75 GB UTF-8 bytes)
#
# Throughput & Multi-GPU Optimizations Enabled:
#   1. Jagged Top-2 `torch.nn.functional.grouped_mm` BF16 Tensor Core MoE dispatch (32x less FLOPs on 64 experts)
#   2. Cross-rank synchronized length-tier bucketing (`length_bucketing: true`, zero straggler barrier bubbles)
#   3. Coalesced 64MB BF16/FP32 NVLink AllReduce + per-rank isolated TorchInductor caches
#   4. 512 KB/step global byte budget (`131,072 B/GPU x 4 GPUs`, `grad_accum_steps = 1`)
#   5. 100% compatible with Rust `dcpa-core-rs` (`vocab=256`, `k_slots=8`, `stack_depth=16`, `d_l=64`)

schema_version: 2
experiment_name: dcpa_v2_2_6b_moe64_4xa100_200k

