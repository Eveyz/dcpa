# DCPA 210M Sparse Micro-MoE Preset (32 Experts, Top-2 Active) — 100,000-Step Training Contract
#
# Measured slow weights: ~208.65M total | ~22.86M active per concept step (M3 Pro latency near-identical!)
# Integrates Capability Upgrade Spec 1-5:
#   - L_max = 8 deep latent pondering + per-sample ponder_tax_scale (0.0 on 40% latent reasoning)
#   - Static-shape Slot-0 Thesis Pinning + 32D lang ⊕ 32D style orthogonal control vector
#   - Switch-style MoE load-balancing auxiliary loss: lambda_moe_bal = 0.01 * N_E * sum(f_e * P_e)
#   - Stage 3 mixes cap_reasoning + cap_writing at 35%; Stage 5 runs 8,000 steps across all capability shards

schema_version: 2
experiment_name: dcpa_210m_moe32_developmental_100k

model:
  preset: moe_210m
  vocab_size: 256
  d_s: 192
  d_concept: 768
  k_slots: 8
  d_r: 32
  d_merge: 256
  d_h: 4096
  s_active: 32
  d_l: 64
  num_lang_domains: 6
  num_style_domains: 5
  num_experts: 32
  top_k_experts: 2
  expert_hidden: 512
  l_max: 4
  window_size: 128
  clause_chunk_size: 16
  n_enc_layers: 2
  n_dec_layers: 2
  n_heads: 8
  cort_expert_hidden: 384
  shared_expert_hidden: 768
  tau_skip: 0.32
  tau_halt: 0.22
  ponder_eta: 0.5
  lambda_moe_bal: 0.01
  max_seg_len: 16
  target_spike_rate: 0.10526315789473684  # 1 / 9.5
  lambda_rate: 2.0
  lambda_var: 1.0
  lambda_act: 0.01
  lambda_halt: 1.0
  gamma_hip: 0.999
  lambda_eta: 0.95
  kappa_quench: 0.95
  householder_max_writes: 32
  householder_write_threshold: 0.05

wandb:
  enabled: false
  project: dcpa-turbo
  mode: online

presets:
  moe_210m:
    tau_skip: 0.32
    tau_halt: 0.22
    lambda_act: 0.01
    lambda_moe_bal: 0.01
  proto_48m:
    tau_skip: 0.32
    tau_halt: 0.22
    lambda_act: 0.01
    lambda_moe_bal: 0.01
  micro:
    lambda_moe_bal: 0.01

hardware:
  target_tokens_bytes_per_step: 131072
  allow_tf32: true
  bf16_autocast: true
  use_grad_scaler: false
  compile_mode: auto
  compile_doc_bucket_size: 16
  compile_cache_size_limit: 128
  bcg_checkpoint_vram_watermark_gb: 48.0
  # A1 stream carry (Stages B/C, default ON on feat/dcpa-turbo-parallel): S parallel byte streams x `stream_chunk_bytes`
  # per micro-step with detached recurrent state (SGSC/PMD scans, scope depth, BCG-PC graph, cortical W-ring, causal shift)
  # carried across optimizer steps -> serial BCG depth ~chunk/rho instead of ~max_doc_bytes/rho, BCG width ~S streams.
  # Disable with `stream_carry: false` or `--no-stream-carry`.
  stream_carry: true
  stream_chunk_bytes: 512
  stream_min_piece_bytes: 64
  # A2 (CUDA only, default ON on feat/dcpa-turbo-parallel): CUDA-Graph (`reduce-overhead`) capture of the static-shape
  # BCG-PC clause-chunk kernel (used when chunk activation checkpointing is not engaged; auto-falls back on capture errors).
  bcg_cudagraphs: true
  prefetch_depth: 2
  auto_sharding_tiers:
    blackwell_or_h200_96g:
      min_vram_gb: 88.0
      target_tokens_bytes_per_step: 262144
      micro_batch_bytes: 262144
      grad_accum_steps: 1
    h100_or_a100_80g:
      min_vram_gb: 75.0
      micro_batch_bytes: 131072
      grad_accum_steps: 1
    a100_40g:
      min_vram_gb: 38.0
      micro_batch_bytes: 65536
      grad_accum_steps: 2
    l4_or_4090:
      min_vram_gb: 20.0
      micro_batch_bytes: 32768
      grad_accum_steps: 4
    local_mps_or_cpu:
      min_vram_gb: 0.0
      target_tokens_bytes_per_step: 8192
      micro_batch_bytes: 8192
      grad_accum_steps: 1

optimizer:
  type: AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip_norm: 1.0
  groups:
    group_matrix_decay:
      lr: 4.0e-4
      weight_decay: 0.05
    group_norm_embed_nodecay:
      lr: 4.0e-4
      weight_decay: 0.0
    group_gates_thresholds:
      lr: 1.0e-3
      weight_decay: 0.0

curriculum:
  total_steps: 100000
  stage_boundaries: [0, 15000, 65000, 94000, 100000]
  stage1:
    name: sensorimotor_spelling_autoencoder
    model_stage: A
    global_warmup_steps: 2000
    max_doc_bytes: 512
    domain_weights: [0.38, 0.42, 0.10, 0.10]
    wug_ratio: 0.0
    tau_s_start: 1.0
    tau_s_end: 0.35
    target_rho: 9.5
    lambda_rate: 2.0
    lambda_var: 1.0
    lambda_halt: 1.0
    lambda_pc: 0.0
    lambda_act: 0.0
  stage2:
    name: bottlenecked_concept_merge_and_pondering
    model_stage: B
    bcg_local_warmup_steps: 1000
    local_warmup_start_factor: 0.01
    window_schedule:
      - [15000, 512]
      - [35000, 1024]
      - [50000, 2048]
    domain_weights: [0.34, 0.40, 0.13, 0.13]
    wug_ratio: 0.0
    tau_m_start: 1.5
    tau_m_end: 0.25
    tau_s: 0.30
    target_rho: 9.5
    lambda_rate: 2.0
    lambda_var: 1.0
    lambda_halt: 1.0
    lambda_pc_ramp_steps: 3000
    lambda_pc_target: 0.5
    lambda_act_delay_steps: 1000
    lambda_act_ramp_steps: 9000
    lambda_act_target: 0.01
  stage3:
    name: cross_lingual_reasoning_writing_and_code_stack
    model_stage: C
    lr_cosine_end_ratio: 0.25
    max_doc_bytes: 4096
    domain_weights: [0.28, 0.34, 0.19, 0.19]
    wug_ratio: 0.0
    tau_m: 0.25
    tau_s: 0.25
    target_rho: 9.5
    lambda_rate: 2.0
    lambda_var: 1.0
    lambda_halt: 1.0
    lambda_pc: 0.5
    lambda_act: 0.01
    code_delimiter_focal_weight: 1.5
    code_delimiter_chars: "{}()[]:;\n"
    broca_cq_prob: 0.20
    cap_mix_ratio: 0.45
  stage4:
    name: hippocampal_oneshot_meta_plasticity
    model_stage: D
    hip_local_warmup_steps: 500
    local_warmup_start_factor: 0.01
    lr_scale: 0.25
    max_doc_bytes: 1024
    domain_weights: [0.25, 0.25, 0.25, 0.25]
    wug_ratio: 0.50
    wug_target_weight: 3.0
    lambda_ach_reg: 0.5
    tau_m: 0.25
    tau_s: 0.25
    lambda_rate: 0.0
    lambda_var: 0.0
    lambda_halt: 0.0
    lambda_pc: 0.0
    lambda_act: 0.0

watchdog:
  window_size: 20
  rule_bcd_warmup_steps: 500
  compression_ratio_min: 2.5
  compression_ratio_max: 25.0
  concept_std_min_floor: 0.35
  merge_entropy_min: 0.08
  skip_batches_on_rollback: 10
  seed_stride_on_rollback: 9973
  rule_a_lr_multiplier: 0.7
  rule_b_lambda_rate_multiplier: 3.0
  rule_b_lambda_rate_cap: 50.0
  rule_b_tau_s_floor: 0.5
  rule_c_lambda_var_multiplier: 2.5
  rule_c_lambda_var_cap: 25.0
  rule_d_tau_m_delta: 0.4
  rule_d_tau_m_cap: 1.2
  rule_d_explore_steps: 1000
  rule_d_uniform_mix: 0.10
  rule_d_merge_kl_weight: 0.10
  max_consecutive_rollbacks: 3
  min_progress_steps_to_reset_breaker: 200
  events_log_path: artifacts/logs/watchdog_events.jsonl

checkpointing:
  ckpt_dir: artifacts/checkpoints
  healthy_save_every_steps: 1000
  milestone_every_steps: 5000
  save_every_minutes: 10.0
  export_dir: artifacts/export
  final_safetensors_name: dcpa_final.safetensors

visual_probe:
  console_every_steps: 50
  probe_every_steps: 500
  logs_dir: artifacts/logs
  metrics_jsonl: metrics.jsonl
  latest_probe_md: latest_probe.md
  probe_history_md: probe_history.md
  val_batches_per_domain: 2
