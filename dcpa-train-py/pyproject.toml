[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpa-train"
version = "0.1.0"
description = "Developmental Concept-Predictive Architecture (DCPA) PyTorch + Triton Training Plane"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
cuda = ["triton>=3.0.0"]

[tool.setuptools.packages.find]
include = ["dcpa*"]
